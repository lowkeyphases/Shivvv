<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a1942;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Poppins',sans-serif;color:var(--ink)}
body{background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a6c1ee,#c2e9fb,#ffecd2);background-size:400% 400%;animation:bg 14s ease infinite}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.orb{position:fixed;border-radius:50%;filter:blur(50px);opacity:.55;animation:drift 12s ease-in-out infinite alternate;pointer-events:none}
.o1{width:260px;height:260px;background:#ff6fb5;top:-60px;left:-60px}
.o2{width:300px;height:300px;background:#7f9cff;bottom:-80px;right:-80px;animation-delay:-4s}
.o3{width:200px;height:200px;background:#ffd36e;top:40%;left:55%;animation-delay:-8s}
@keyframes drift{to{transform:translate(60px,-50px) scale(1.2)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:2;transition:opacity 1s,transform 1s}
.screen.hide{opacity:0;transform:scale(1.15);pointer-events:none}
.script{font-family:'Dancing Script',cursive}
h1{font-size:clamp(2.2rem,8vw,4rem);background:linear-gradient(90deg,#e0267a,#7b2ff7,#ff8a00,#e0267a);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:300%}}
.sub{margin-top:10px;opacity:.8;font-weight:300}
.env{margin-top:34px;width:150px;height:105px;background:linear-gradient(#ff7eb3,#ff5c8a);border-radius:8px;position:relative;cursor:pointer;box-shadow:0 18px 40px rgba(224,38,122,.45);animation:bob 2.4s ease-in-out infinite}
.env:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 50%,#ff9dc0 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 50%,#ff9dc0 50%) right/50% 100% no-repeat;border-radius:8px}
.env:after{content:"❤";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;color:#fff;animation:beat 1.1s infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(-2deg)}}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.3)}}
.tap{margin-top:26px;font-size:.9rem;letter-spacing:2px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.card{width:min(92vw,560px);max-height:70vh;overflow-y:auto;min-height:260px;background:linear-gradient(rgba(255,255,255,.74),rgba(255,255,255,.74)) padding-box,linear-gradient(90deg,#ff3d8b,#ffb300,#2ee6a6,#3d8bff,#b04dff,#ff3d8b) border-box;background-size:100% 100%,300% 100%;background-position:0 0,0 0;backdrop-filter:blur(14px);border:3.5px solid transparent;border-radius:26px;padding:30px 26px;box-shadow:0 20px 60px rgba(123,47,247,.25);animation:pop .8s cubic-bezier(.2,1.4,.4,1),borderflow 5s linear infinite}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.85) rotate(-3deg)}}
.card h2{font-size:2rem;margin-bottom:14px;color:#c2185b}
.card p{font-size:.98rem;line-height:1.8;text-align:left;white-space:pre-wrap}
.nav{display:flex;gap:12px;margin-top:22px;align-items:center;justify-content:center}
button{border:none;cursor:pointer;font-family:inherit;font-weight:600;padding:12px 24px;border-radius:40px;color:#fff;background:linear-gradient(90deg,#ff5c8a,#7b2ff7);box-shadow:0 8px 22px rgba(123,47,247,.35);transition:transform .2s}
button:hover{transform:scale(1.08)}button:disabled{opacity:.35;pointer-events:none}
.dots{display:flex;gap:7px;margin-top:16px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(74,25,66,.25);transition:.4s}
.dots i.on{background:#e0267a;transform:scale(1.6)}
#mute{position:fixed;top:14px;right:14px;z-index:5;padding:10px 14px;font-size:1.1rem}
#end h1{font-size:clamp(2rem,7vw,3.4rem)}
.big{font-size:5rem;animation:beat 1.2s infinite}

body{background:linear-gradient(135deg,#ff6ec4,#ffb86c,#ffe66d,#7cf0c9,#6ec6ff,#b388ff,#ff6ec4);background-size:500% 500%;animation:bg 12s ease infinite}
.o4{width:220px;height:220px;background:#2ee6a6;top:55%;left:-50px;animation-delay:-2s}
.o5{width:240px;height:240px;background:#ff5252;top:-40px;right:15%;animation-delay:-6s}
@keyframes borderflow{to{background-position:0 0,300% 0}}
.card h2{background:linear-gradient(90deg,#e0267a,#7b2ff7,#ff8a00,#00b894,#e0267a);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
.env{animation:bob 2.4s ease-in-out infinite,hue 6s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg) drop-shadow(0 0 18px #ff6ec4)}}
.card{box-shadow:0 0 40px rgba(255,110,196,.55),0 20px 60px rgba(123,47,247,.3)}
.sign{margin-top:22px;font-size:clamp(2.2rem,9vw,3.6rem);background:linear-gradient(90deg,#ff3d8b,#ff9100,#00c9a7,#3d8bff,#b04dff,#ff3d8b);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.big{filter:drop-shadow(0 0 22px #ff3d8b)}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div><div class="orb o5"></div>
<canvas id="fx"></canvas>
<button id="mute" title="Music on/off">🔊</button>

<!-- Intro -->
<div class="screen" id="intro">
  <h1 class="script" id="hello">Hey you…</h1>
  <p class="sub">Someone wrote a few things just for you 💖</p>
  <div class="env" id="env"></div>
  <p class="tap">TAP THE ENVELOPE</p>
</div>

<!-- Letters -->
<div class="screen hide" id="letters">
  <div class="card" id="card" key="0">
    <h2 class="script" id="ltitle"></h2>
    <p id="ltext"></p>
  </div>
  <div class="nav">
    <button id="prev">← Back</button>
    <button id="next">Next →</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

<!-- End -->
<div class="screen hide" id="end">
  <div class="big">💞</div>
  <h1 class="script" id="endTitle"></h1>
  <p class="sub" id="endText" style="max-width:480px;line-height:1.8"></p>
  <div class="sign script" id="endSign"></div>
  <button style="margin-top:26px" id="again">Read again 🌸</button>
</div>

<div style="position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;overflow:hidden"><div id="yt1"></div></div>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
/* ============ EDIT THIS PART ============ */
const HER_NAME  = "Shivanii";      // her name / nickname (you can use "Shvziii" too)
const YOUR_NAME = "Omm";     // your name
const SONG1 = {id:"x47TgeRJtH0", start:50};   // Reflections - The Neighbourhood. start = second where the best part begins
const LETTERS = [
  {t:"My feelings for you 💖", m:`${HER_NAME}, one of the things I adore most about you is your personality. I love the way you talk, the way you make me laugh, and how effortlessly you can turn an ordinary moment into a happy one. Whenever you're around, there's this beautiful, positive energy that makes everything feel better.

What I admire even more is how understanding and caring you are. You're someone who listens, supports others, and knows how to comfort people when they're going through difficult times. The way you understand people and bring a little happiness into their lives is something truly special.

And honestly, you do the same for me. Even the smallest things you do can make my day better. You probably don't realise how much happiness your presence brings me, but I hope you know that simply being yourself is one of the many reasons I adore you.`},
  {t:"I'm here with you 🤗", m:`${HER_NAME}, I know things haven't been quite the same for you lately. Losing a friendship that has been a part of your life since childhood isn't something easy to deal with. I know how much that bond meant to you, and I can only imagine how difficult it must be to accept that things have turned out this way.

You keep telling me that you're gradually feeling better, and I genuinely hope you are. But I also want you to know that you don't have to pretend to be okay just to make me feel better. It's completely alright to feel upset, to have bad days, and to take your own time to process everything. You don't have to rush yourself into feeling normal again.

I might not be able to undo what's happened or take away all the sadness you're feeling, but I want to be someone you can talk to whenever things feel overwhelming. You don't always need to have a smile on your face around me, and you don't need to hide your feelings either.

Please remember that you're not alone in this. I care about you, not just during your happiest moments, but also during the days when everything feels a little difficult. Take your time, ${HER_NAME}. Your happiness matters to me, and I'll always want to see you smiling again.`},
  {t:"My message to you 💌", m:`${HER_NAME}, there's something I really want you to understand. You never have to pretend to be happy around me or hide what you're actually feeling. Even on your worst days, you can be completely yourself. I want you to know that I'll always listen to you without judging you, no matter what you're going through.

I may not always have the perfect words to make things better, but I'll always try to understand you and support you in every way I can, without putting any pressure on you to feel better quickly. Take your time; your feelings matter, and you deserve to be understood.

And one more thing, you genuinely deserve friendships filled with honesty, loyalty, care, and mutual respect. Never settle for anything less than the genuine connections you deserve.

And ${HER_NAME}, I don't want to be someone you feel you have to be happy around. I want to be someone you can be completely yourself around.

Love from ${YOUR_NAME}. 💕`}
];
const END_TITLE = "I love you, " + HER_NAME + " ❤";
const END_TEXT  = "Whatever happens, you have me. Now go smile — the world looks better when you do.";
/* ======================================== */

const $=id=>document.getElementById(id);
let muted=false,i=0,typer;
function mk(div,song){
  const o={ready:false,want:false,paused:true,_v:0,
    get volume(){return this._v},
    set volume(x){this._v=x;if(this.ready)this.yt.setVolume(Math.round(x*100))},
    play(){this.paused=false;this.want=true;if(this.ready){this.yt.setVolume(Math.round(this._v*100));this.yt.playVideo()}return Promise.resolve()},
    pause(){this.paused=true;this.want=false;if(this.ready)this.yt.pauseVideo()}};
  o.init=()=>{o.yt=new YT.Player(div,{width:'200',height:'200',videoId:song.id,
    playerVars:{start:song.start,playsinline:1,controls:0,rel:0,modestbranding:1},
    events:{onReady:()=>{o.ready=true;o.yt.setVolume(Math.round(o._v*100));if(o.want)o.yt.playVideo()},
      onStateChange:e=>{if(e.data===0){o.yt.seekTo(song.start,true);o.yt.playVideo()}}}})};
  return o;
}
const a1=mk('yt1',SONG1);
window.onYouTubeIframeAPIReady=()=>{a1.init()};

function fade(el,to,ms=2500){
  const from=el.volume,steps=30,d=(to-from)/steps;let n=0;
  const t=setInterval(()=>{n++;el.volume=Math.min(1,Math.max(0,from+d*n));
    if(n>=steps){clearInterval(t);if(to===0)el.pause()}},ms/steps);
}
function play(el){el.play();fade(el,muted?0:.9)}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';
  [a1].forEach(a=>{if(!a.paused)a.volume=muted?0:.9})};

/* Browsers block sound until the first touch, so song 1 starts on her first tap/click */
let started=false;
function startSong1(){if(started)return;started=true;play(a1)}
['click','touchstart','keydown'].forEach(e=>document.addEventListener(e,startSong1,{once:true}));

/* Intro -> Letters */
$('env').onclick=()=>{
  burst(innerWidth/2,innerHeight/2,60);
  $('intro').classList.add('hide');
  setTimeout(()=>{$('letters').classList.remove('hide');show(0);
    },700);
};

/* Letters */
for(let k=0;k<LETTERS.length;k++)$('dots').appendChild(document.createElement('i'));
function show(n){
  i=n;const L=LETTERS[n],c=$('card');
  c.style.animation='none';void c.offsetWidth;c.style.animation='';
  $('ltitle').textContent=L.t;
  clearInterval(typer);const p=$('ltext');p.textContent='';let k=0;
  typer=setInterval(()=>{k+=3;p.textContent=L.m.slice(0,k);c.scrollTop=c.scrollHeight;if(k>=L.m.length){p.textContent=L.m;clearInterval(typer);c.scrollTop=0}},22);
  [...$('dots').children].forEach((d,x)=>d.classList.toggle('on',x===n));
  $('prev').disabled=n===0;
  $('next').textContent=n===LETTERS.length-1?'Finish 💖':'Next →';
  burst(innerWidth/2,innerHeight/2.4,18);
}
$('next').onclick=()=>{
  if(i<LETTERS.length-1)show(i+1);
  else{clearInterval(typer);$('letters').classList.add('hide');
    $('endTitle').textContent=END_TITLE;$('endText').textContent=END_TEXT;
    $('end').classList.remove('hide');
    for(let k=0;k<6;k++)setTimeout(()=>burst(Math.random()*innerWidth,Math.random()*innerHeight*.6,50),k*350)}
};
$('card').onclick=()=>{clearInterval(typer);$('ltext').textContent=LETTERS[i].m};
$('prev').onclick=()=>show(i-1);
$('again').onclick=()=>{$('end').classList.add('hide');$('letters').classList.remove('hide');show(0)};
$('hello').textContent="Hey "+HER_NAME+"…";

/* Effects: floating hearts + sparkle bursts + cursor trail */
const cv=$('fx'),cx=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
const em=['💖','💕','✨','🌸','💗','🦋','⭐','💫'];
const ps=[];
function float(){ps.push({e:em[Math.random()*em.length|0],x:Math.random()*W,y:H+20,s:14+Math.random()*26,v:.6+Math.random()*1.6,w:Math.random()*6,a:1,g:0,float:true})}
function burst(x,y,n){for(let k=0;k<n;k++){const an=Math.random()*6.28,sp=2+Math.random()*7;
  ps.push({e:em[Math.random()*em.length|0],x,y,s:12+Math.random()*18,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-3,a:1,g:.14})}}
addEventListener('pointermove',e=>{if(Math.random()<.35)ps.push({e:'✨',x:e.clientX,y:e.clientY,s:14,vx:(Math.random()-.5)*2,vy:Math.random()*-2,a:1,g:.05})});
setInterval(float,380);
const stars=Array.from({length:110},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.4,t:Math.random()*6}));
(function loop(){cx.clearRect(0,0,W,H);
  for(const st of stars){cx.globalAlpha=.25+.75*Math.abs(Math.sin(st.t+=.03));cx.fillStyle='#fff';cx.beginPath();cx.arc(st.x*W,st.y*H,st.r,0,6.28);cx.fill()}
  for(let k=ps.length-1;k>=0;k--){const p=ps[k];
    if(p.fall){p.y+=p.vy;p.x+=Math.sin(p.y/30)*1.2;p.rot+=.05;if(p.y>H+20){ps.splice(k,1);continue}
      cx.globalAlpha=.9;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-4,-2,9,5);cx.restore();continue}
    if(p.float){p.y-=p.v;p.x+=Math.sin(p.w+=.03)*1.1;p.a=Math.min(1,p.y/(H*.3))}
    else{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.a-=.012}
    if(p.a<=0||p.y<-40){ps.splice(k,1);continue}
    cx.globalAlpha=Math.max(0,p.a);
    if(p.c){cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=12;cx.beginPath();cx.arc(p.x,p.y,p.s/4,0,6.28);cx.fill();cx.shadowBlur=0}
    else{cx.font=p.s+'px serif';cx.fillText(p.e,p.x,p.y)}}
  requestAnimationFrame(loop)})();
const cols=['#ff3d8b','#ffb300','#2ee6a6','#3d8bff','#b04dff','#ff5252','#fff176'];
function colorBurst(x,y,n){for(let k=0;k<n;k++){const an=Math.random()*6.28,sp=2+Math.random()*8;
  ps.push({c:cols[Math.random()*cols.length|0],x,y,s:8+Math.random()*12,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,a:1,g:.09})}}
setInterval(()=>ps.push({fall:true,c:cols[Math.random()*cols.length|0],x:Math.random()*W,y:-10,vy:1.2+Math.random()*2.2,rot:Math.random()*6}),140);
const _b=burst;burst=function(x,y,n){_b(x,y,n);colorBurst(x,y,Math.round(n*1.3))};
document.addEventListener('pointerdown',e=>{if(e.target.id!=='mute'){colorBurst(e.clientX,e.clientY,24);_b(e.clientX,e.clientY,8)}});
$('endSign').textContent="Love from "+YOUR_NAME+".";

</script>
</body>
</html>
